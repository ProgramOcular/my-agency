<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- THIS TAG FIXES THE MOBILE SCALING -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FAVICONS -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <meta name="msapplication-TileImage" content="/assets/favicon-192x192.png">
    <meta name="msapplication-TileColor" content="#050505">
 
<link rel="canonical" href="https://programocular.com/login.html">
    <title>Secure Access — Ocular</title>
<link href="output.css" rel="stylesheet"> </link>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;900&display=swap" rel="stylesheet">
        <style>
        body { 
            background-color: #050505; 
            color: #F3F3F3; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* --- CRT POWER ON ANIMATION --- */
        .crt-container {
            animation: turnOn 0.4s linear forwards;
            transform-origin: center;
            opacity: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes turnOn {
            0% { transform: scale(1, 0.002) translate3d(0, 0, 0); filter: brightness(3); opacity: 1; }
            60% { transform: scale(1, 0.002) translate3d(0, 0, 0); }
            100% { transform: scale(1, 1) translate3d(0, 0, 0); filter: brightness(1); opacity: 1; }
        }

        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.1);
            animation: scan 3s linear infinite; pointer-events: none; z-index: 50;
        }
        @keyframes scan { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .shake { animation: shake 0.5s; border-color: #ef4444 !important; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body class="relative">

    <!-- Back to Previous Page (Updated to use history.back()) -->
    <a href="javascript:history.back()" class="absolute top-6 left-6 md:top-8 md:left-8 text-xs font-mono text-gray-600 hover:text-white transition-colors flex items-center gap-2 z-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        ABORT / RETURN
    </a>

    <div class="scan-line"></div>

    <div class="crt-container">
        <div class="w-full max-w-md p-6 md:p-8">
            <!-- Header -->
            <div class="text-center mb-8 md:mb-10">
                <a href="index.html" class="inline-block mb-6">
                    <svg class="w-12 h-12 md:w-16 md:h-16 mx-auto text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
                </a>
                <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white">Project Console</h1>
                <p class="text-xs font-mono text-gray-500 mt-2">RESTRICTED ACCESS // EXISTING CLIENTS ONLY</p>
            </div>

            <!-- Login Form -->
            <form class="space-y-6" id="loginForm" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-mono text-gray-500 mb-2">PROJECT ID</label>
                    <!-- Increased text size to text-base for mobile readability -->
                    <input type="text" id="project_id" class="w-full bg-[#121212] border border-white/10 rounded-lg px-4 py-4 text-base text-white focus:outline-none focus:border-white transition-colors font-mono" placeholder="ENTER ID">
                </div>
                
                <div>
                    <label class="block text-xs font-mono text-gray-500 mb-2">ACCESS KEY</label>
                    <!-- Added tracking-widest here to space out the dots -->
                    <input type="password" id="access_key" class="w-full bg-[#121212] border border-white/10 rounded-lg px-4 py-4 text-base text-white focus:outline-none focus:border-white transition-colors font-mono tracking-widest" placeholder="••••••••">
                </div>

                <button id="submitBtn" class="w-full bg-white text-black font-bold py-4 md:py-5 rounded-lg hover:bg-gray-200 transition duration-300 flex justify-center items-center group text-lg">
                    <span id="btnText">Enter</span>
                </button>
                
                <p id="errorMsg" class="text-red-500 text-xs font-mono text-center hidden">ACCESS DENIED: INVALID CREDENTIALS</p>
            </form>

            <div class="mt-8 text-center">
                <a href="contact-us.html" class="text-xs text-gray-600 hover:text-white transition-colors">Request Access Credentials →</a>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        function handleLogin(e) {
            e.preventDefault();
            
            const idInput = document.getElementById('project_id');
            const keyInput = document.getElementById('access_key');
            
            const enteredId = idInput.value.toUpperCase().trim();
            const enteredKey = keyInput.value.trim();
            
            const btnText = document.getElementById('btnText');
            const errorMsg = document.getElementById('errorMsg');
            
            // --- CONFIGURATION: YOUR CLIENT DATABASE ---
            const clientDatabase = {
                "OC-2025": "OCULAR",      
                "NEBULA": "LAUNCH",       
                "CALYPSO": "WATER",       
                "VIP": "SECRET"           
            };
            
            // Visual Loading State
            btnText.innerText = "Verifying Access...";
            errorMsg.classList.add('hidden');
            keyInput.classList.remove('shake');

            setTimeout(() => {
                if (clientDatabase[enteredId] && clientDatabase[enteredId] === enteredKey) {
                    localStorage.setItem('ocular_client_id', enteredId);
                    window.location.href = "dashboard.html";
                } else {
                    btnText.innerText = "Enter";
                    errorMsg.classList.remove('hidden');
                    keyInput.classList.add('shake');
                    keyInput.value = ""; 
                }
            }, 1000);
        }
    </script>

    <div class="absolute bottom-6 left-6 text-[10px] font-mono text-gray-700 hidden md:block">
        SERVER: US-EAST-1<br>
        STATUS: NOMINAL
    </div>

</body>
</html>
