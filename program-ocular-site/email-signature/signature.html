<!--
  HOW TO USE
  1. Upload mark-tile.png somewhere public (your website, e.g. https://programocular.com/email/mark-tile.png)
     and replace src="mark-tile.png" below with that full URL. Email clients can't load local files.
     The logo sits on its own solid Ink tile so it stays visible in both light and dark mode.
  2. Replace the placeholder email, phone, site and social links.
  3. Gmail / Apple Mail: open this file in a browser, select the signature, copy, paste into the signature editor.
     Outlook: Settings > Signatures, paste the same way.
  Geist falls back to Arial in clients that don't load web fonts (most of them), which is expected.
-->
